<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enternine - Kebijakan Privasi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.7;
            color: #1a1a1a;
            background: #f5f5f5;
            padding: 24px 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 720px;
            margin: 40px auto;
            background: #ffffff;
            padding: 48px 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .logo {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-text {
            display: inline-block;
            font-size: 24px;
            font-weight: 700;
            color: #006064;
            letter-spacing: 2px;
            padding: 12px 24px;
            background: #E0F7FA;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #1a1a1a;
            font-size: 24px;
            margin-top: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #757575;
            font-size: 14px;
            margin-bottom: 40px;
        }
        .app-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .app-card {
            display: block;
            padding: 20px 24px;
            background: #fafafa;
            border: 1px solid #eee;
            border-left: 4px solid #0097A7;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }
        .app-card:hover {
            background: #E0F7FA;
            border-left-color: #006064;
            transform: translateX(4px);
        }
        .app-card h3 {
            color: #006064;
            font-size: 18px;
            margin-bottom: 4px;
        }
        .app-card p {
            color: #555;
            font-size: 14px;
        }
        .app-card .arrow {
            color: #0097A7;
            font-size: 20px;
            float: right;
            margin-top: -28px;
        }
        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #999;
        }
        .footer a {
            color: #0097A7;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            .container { padding: 32px 20px; margin: 16px auto; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="logo">
            <span class="logo-text">ENTERNINE</span>
        </div>

        <h1>Kebijakan Privasi</h1>
        <p class="subtitle">Pilih aplikasi untuk melihat kebijakan privasinya</p>

        <div class="app-list">

            <a href="cashbook.html" class="app-card">
                <h3>CashBook <span class="arrow">→</span></h3>
                <p>Aplikasi pencatat keuangan pribadi</p>
            </a>

            <!-- Nanti tambahkan di sini kalau EnternineAppos sudah siap -->
            <!--
            <a href="appos.html" class="app-card">
                <h3>EnternineAppos <span class="arrow">→</span></h3>
                <p>Aplikasi Point of Sale</p>
            </a>
            -->

        </div>

        <div class="footer">
            &copy; 2026 Enternine. All rights reserved.<br>
            Kontak: <a href="mailto:enternineappos@gmail.com">enternineappos@gmail.com</a>
        </div>

    </div>
</body>
</html>
